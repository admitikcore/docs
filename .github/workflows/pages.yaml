name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install the theme and the tooling
        run: |
          npm ci
          npm ci --prefix themes/docsy

      - name: Install Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "0.170.1"
          extended: true

      - name: Put Dart Sass on the PATH
        run: |
          for d in node_modules/sass-embedded-*/dart-sass; do
            if "$d/sass" --version >/dev/null 2>&1; then
              echo "$PWD/$d" >> "$GITHUB_PATH"
              break
            fi
          done

      - uses: actions/configure-pages@v5
        id: pages
        with:
          enablement: true

      - name: Build
        run: hugo --gc --minify --baseURL "${{ steps.pages.outputs.base_url }}/"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
